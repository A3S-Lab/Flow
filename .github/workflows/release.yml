name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Tag name to release, for example v1.0.0-rc.1"
        required: false
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CRATE_NAME: a3s-flow

jobs:
  security:
    name: Dependency security and policy
    uses: ./.github/workflows/security.yml
    permissions:
      contents: read
      checks: write

  ci:
    name: CI Checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: a3s_flow
          POSTGRES_PASSWORD: a3s_flow
          POSTGRES_USER: a3s_flow
        options: >-
          --health-cmd "pg_isready -U a3s_flow -d a3s_flow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
        ports:
          - 5432:5432
    env:
      A3S_FLOW_POSTGRES_URL: postgres://a3s_flow:a3s_flow@127.0.0.1:5432/a3s_flow
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Bun
        id: setup-bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check release version
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag_name || github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')"
          EXPECTED_TAG="v${VERSION}"
          if [ "$RELEASE_TAG" != "$EXPECTED_TAG" ]; then
            echo "Release tag ${RELEASE_TAG} does not match Cargo.toml version ${VERSION}."
            exit 1
          fi

      - name: Check released API compatibility
        uses: obi1kenobi/cargo-semver-checks-action@6b69fcf40e9b5fb17adeb57e4b6ecd020649a239 # v2
        with:
          feature-group: all-features
          shared-key: release-api-compatibility

      - name: Resolve frozen v1 API baseline
        id: v1-api-baseline
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $revision = (Get-Content ".github/v1-api-baseline.txt" -Raw).Trim()
          if ($revision -notmatch "^[0-9a-f]{40}$") {
            throw "The frozen v1 API baseline must be a full lowercase commit SHA."
          }
          git cat-file -e "$revision^{commit}"
          if ($LASTEXITCODE -ne 0) {
            throw "The frozen v1 API baseline commit is unavailable: $revision"
          }
          "revision=$revision" >> $env:GITHUB_OUTPUT

      - name: Enforce the frozen v1 API contract
        uses: obi1kenobi/cargo-semver-checks-action@6b69fcf40e9b5fb17adeb57e4b6ecd020649a239 # v2
        with:
          baseline-rev: ${{ steps.v1-api-baseline.outputs.revision }}
          feature-group: all-features
          release-type: minor
          shared-key: release-api-compatibility

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test without default features
        run: cargo test --all-targets --no-default-features

      - name: Test default features
        run: cargo test --all-targets

      - name: Test SQLite only
        run: cargo test --all-targets --no-default-features --features sqlite

      - name: Test A3S Boot only
        run: cargo test --all-targets --no-default-features --features boot

      - name: Test A3S Event feature
        run: cargo test --all-targets --no-default-features --features a3s-event

      - name: Test SQLite and native TypeScript features
        run: cargo test --all-targets --no-default-features --features sqlite,native-ts

      - name: Test A3S Boot with ORM storage
        run: cargo test --all-targets --no-default-features --features boot,sqlite

      - name: Test all features with real PostgreSQL
        run: cargo test --all-targets --all-features -- --test-threads=1

      - name: Build documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --all-features --no-deps

      - name: Build the installable compiler
        run: cargo build --bin a3s-flow-native-compiler

      - name: Test real Bun compilation and execution
        env:
          A3S_FLOW_BUN: ${{ steps.setup-bun.outputs.bun-path }}
          A3S_FLOW_NATIVE_TS_COMPILER: ${{ github.workspace }}/target/debug/a3s-flow-native-compiler
        run: >-
          cargo test --test native_ts_bun_smoke --features native-ts --
          --ignored --exact native_ts_compiler_executes_real_bun_workflow

  msrv:
    name: Rust 1.88 MSRV
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust 1.88
        uses: dtolnay/rust-toolchain@1.88.0

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: release-msrv-1.88

      - name: Check all targets and features on the MSRV
        shell: pwsh
        run: ./.github/scripts/check-msrv.ps1

  native-ts-windows:
    name: Native TypeScript Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Bun
        id: setup-bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: release-native-ts-windows

      - name: Build the installable compiler
        run: cargo build --bin a3s-flow-native-compiler

      - name: Test real Bun compilation and execution
        env:
          A3S_FLOW_BUN: ${{ steps.setup-bun.outputs.bun-path }}
          A3S_FLOW_NATIVE_TS_COMPILER: ${{ github.workspace }}/target/debug/a3s-flow-native-compiler.exe
        run: >-
          cargo test --test native_ts_bun_smoke --features native-ts --
          --ignored --exact native_ts_compiler_executes_real_bun_workflow

  package:
    name: Package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Verify package
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/a3s-flow-package-target
        run: cargo package --locked

  publish-crate:
    name: Publish to crates.io
    needs:
      - security
      - ci
      - msrv
      - native-ts-windows
      - package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          CARGO_TOKEN: ${{ secrets.CARGO_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')"
          if curl -fsSL "https://crates.io/api/v1/crates/${CRATE_NAME}/${VERSION}" >/dev/null 2>&1; then
            echo "${CRATE_NAME} ${VERSION} already exists on crates.io, skipping publish."
            exit 0
          fi

          TOKEN="${CARGO_REGISTRY_TOKEN:-${CARGO_TOKEN:-}}"
          if [ -z "$TOKEN" ]; then
            echo "Missing CARGO_REGISTRY_TOKEN or CARGO_TOKEN repository secret."
            exit 1
          fi

          set +e
          OUTPUT="$(cargo publish --token "$TOKEN" 2>&1)"
          STATUS=$?
          set -e
          echo "$OUTPUT"
          if [ "$STATUS" -ne 0 ]; then
            if echo "$OUTPUT" | grep -Eqi "already (uploaded|exists)"; then
              echo "${CRATE_NAME} ${VERSION} was already published, treating as success."
              exit 0
            fi
            exit "$STATUS"
          fi

  github-release:
    name: GitHub Release
    needs: publish-crate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.inputs.tag_name || github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --title "$RELEASE_TAG"
          else
            gh release create "$RELEASE_TAG" \
              --title "$RELEASE_TAG" \
              --generate-notes
          fi
